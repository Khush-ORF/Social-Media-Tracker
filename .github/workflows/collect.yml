name: Collect Follower Counts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Optional platform: YouTube, X, LinkedIn, Instagram, Facebook"
        required: false
        default: ""
  schedule:
    - cron: "30 18 28-31 * *"

permissions:
  contents: write

concurrency:
  group: collect-follower-counts
  cancel-in-progress: false

jobs:
  collect-hosted:
    if: ${{ github.event.inputs.platform != 'X' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Collect selected platform or all on month end
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || '' }}"
          if [[ "${{ github.event_name }}" == "schedule" && -z "$PLATFORM" && "$(date -u -d tomorrow +%d)" != "01" ]]; then
            echo "Not the last UTC day of the month; skipping scheduled collection."
            exit 0
          fi
          if [[ -n "$PLATFORM" ]]; then
            node app/collect.mjs --platform "$PLATFORM" --render
          else
            echo "Hosted all-platform collection excludes X because X blocks GitHub Actions IPs."
            for PLATFORM_NAME in YouTube LinkedIn Facebook Instagram; do
              echo "::group::Collect $PLATFORM_NAME"
              node app/collect.mjs --platform "$PLATFORM_NAME" --render
              echo "::endgroup::"
            done
          fi
          npm run build:static
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet && echo "No data changes" || git commit -m "Update follower snapshots"
          git pull --rebase origin main
          git push

  collect-x-self-hosted:
    if: ${{ github.event.inputs.platform == 'X' }}
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check local tools
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version
          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
            sqlite3 --version
          } elseif (Test-Path 'C:\msys64\ucrt64\bin\sqlite3.exe') {
            & 'C:\msys64\ucrt64\bin\sqlite3.exe' --version
          } else {
            Write-Warning 'sqlite3 was not found in PATH or C:\msys64\ucrt64\bin. npm run build:static will fail until sqlite3 is installed or SQLITE3_BIN is set.'
          }
      - run: npm install
      - run: npx playwright install chromium
      - name: Collect X on self-hosted runner
        shell: pwsh
        run: |
          node app/collect.mjs --platform X --render
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit collected X data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No data changes"
          } else {
            git commit -m "Update X follower snapshots"
          }
          git pull --rebase origin main
          git push
