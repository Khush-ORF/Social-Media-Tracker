name: Collect Follower Counts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Optional platform: YouTube, X, LinkedIn, Instagram, Facebook"
        required: false
        default: ""
  schedule:
    - cron: "30 18 28-31 * *"

permissions:
  contents: write

concurrency:
  group: collect-follower-counts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Collect selected platform or all on month end
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || '' }}"
          if [[ "${{ github.event_name }}" == "schedule" && -z "$PLATFORM" && "$(date -u -d tomorrow +%d)" != "01" ]]; then
            echo "Not the last UTC day of the month; skipping scheduled collection."
            exit 0
          fi
          if [[ -n "$PLATFORM" ]]; then
            node app/collect.mjs --platform "$PLATFORM"
          else
            for PLATFORM_NAME in YouTube X LinkedIn Instagram Facebook; do
              echo "::group::Collect $PLATFORM_NAME"
              node app/collect.mjs --platform "$PLATFORM_NAME"
              echo "::endgroup::"
            done
          fi
          npm run build:static
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data public/data
          git diff --cached --quiet && echo "No data changes" || git commit -m "Update follower snapshots"
          git push
